# Profil "demo" : base H2 en mémoire, aucune installation de PostgreSQL nécessaire.
# Lancement : mvnw spring-boot:run -Dspring-boot.run.profiles=demo
spring.datasource.url=jdbc:h2:mem:dourek;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
