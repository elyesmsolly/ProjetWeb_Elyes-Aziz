spring.application.name=dourek-api
server.port=8080
# Clés d'IA facultatives dans un fichier à part, jamais envoyé sur GitHub (voir cle-ia.properties.exemple)
spring.config.import=optional:file:./cle-ia.properties,optional:file:./backend/cle-ia.properties

# PostgreSQL en local (modifiable par variables d'environnement)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dourek}
spring.datasource.username=${DB_USER:dourek}
spring.datasource.password=${DB_PASSWORD:dourek}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Secret des jetons JWT : à changer via DOUREK_JWT_SECRET en dehors de la démo
dourek.jwt.secret=${DOUREK_JWT_SECRET:dourek-secret-de-developpement-a-changer}

# Assistant de recherche : la clé est lue dans la variable d'environnement ANTHROPIC_API_KEY
dourek.assistant.modele=${DOUREK_ASSISTANT_MODELE:claude-opus-5-5}
# Messages d'erreur renvoyés au front (nom de la propriété depuis Spring Boot 4)
spring.web.error.include-message=always
# Google Gemini (offre gratuite) : utilisé si GEMINI_API_KEY est définie et pas ANTHROPIC_API_KEY
dourek.gemini.modele=${DOUREK_GEMINI_MODELE:gemini-flash-latest}
dourek.gemini.url=${DOUREK_GEMINI_URL:https://generativelanguage.googleapis.com}
